[package]
name = "smali-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
smali-syntax.workspace = true
smali-index.workspace = true
smali-analysis.workspace = true
tower-lsp-server = "0.23.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
rayon = "1.12.0"
